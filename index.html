<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello World 页面</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        margin: 0;
      }

      .container {
        text-align: center;
      }

      button {
        padding: 10px 16px;
        font-size: 16px;
        cursor: pointer;
      }

      #message {
        margin-top: 12px;
        font-size: 20px;
        color: #333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="helloButton" type="button">点击我</button>
      <p id="message"></p>
    </div>

    <script>
      const button = document.getElementById('helloButton');
      const message = document.getElementById('message');

      button.addEventListener('click', () => {
        message.textContent = 'Hello World';
      });
    </script>
  </body>
</html>
